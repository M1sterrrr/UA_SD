[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv.workspace]
members = [
    "WM_COMMON",
    "WM_Central",
    "WM_FO",
    "WM_WS/WM_WS_E",
    "WM_WS/WM_WS_M",
]

[tool.ruff.lint.isort]
# Our own workspace packages: always sorted as first-party, after third-party ones
known-first-party = ["wm_common", "wm_central", "wm_fo", "wm_ws_e", "wm_ws_m"]
