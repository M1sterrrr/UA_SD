# Pakiet wm-fo. [project.scripts] tworzy komendę WM_FO -> funkcja main() z wm_fo/__init__.py
# (dlatego działa "uv run WM_FO ..."). wm-common pochodzi z tego samego workspace'u (tool.uv.sources).
[project]
name = "wm-fo"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "wm-common",
]

[project.scripts]
WM_FO = "wm_fo:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
wm-common = { workspace = true }
