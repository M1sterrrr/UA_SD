# Pakiet wm-ws-m. [project.scripts] tworzy komendę WM_WS_M -> funkcja main() z wm_ws_m/__init__.py
# (dlatego działa "uv run WM_WS_M ..."). wm-common pochodzi z tego samego workspace'u (tool.uv.sources).
[project]
name = "wm-ws-m"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "wm-common",
]

[project.scripts]
WM_WS_M = "wm_ws_m:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
wm-common = { workspace = true }
