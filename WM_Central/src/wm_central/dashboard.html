<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaterManagement Central</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1d2730; --muted: #66727d; --line: #dde3e8;
    --green: #2e9e4f; --red: #d23b3b; --orange: #e8890c; --gray: #9aa4ad;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14191e; --card: #1e252c; --text: #e6ebef; --muted: #96a2ad; --line: #2e3740; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline;
           margin-bottom: 12px; }
  h1 { margin: 0; font-size: 22px; }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  #status { color: var(--muted); }
  #status.down { color: var(--red); font-weight: 600; }

  /* admin bar: commands for all stations at once */
  #admin { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
           background: var(--card); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  #admin input { width: 70px; padding: 4px 6px; }
  #results { color: var(--muted); font-size: 13px; flex-basis: 100%; }

  /* one card per station */
  #stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
              gap: 12px; }
  .card { border-radius: 10px; padding: 12px 14px; color: #fff; min-height: 150px;
          display: flex; flex-direction: column; }
  .card .id { font-size: 20px; font-weight: 700; }
  .card .loc { opacity: .9; }
  .card .state { margin-top: 6px; font-weight: 600; letter-spacing: .03em; }
  /* always reserve these two lines, so a card that starts watering doesn't grow
     and push the buttons away from under the mouse */
  .card .live, .card .op { font-variant-numeric: tabular-nums; min-height: 1.4em; }
  .card .buttons { margin-top: auto; padding-top: 8px; display: flex; gap: 6px; }
  .card button { flex: 1; color: #fff; background: rgba(255,255,255,.18);
                 border: 1px solid rgba(255,255,255,.5); }
  button { padding: 5px 8px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; }

  /* the colors from the PDF */
  .AVAILABLE      { background: var(--green); }
  .WATERING       { background: var(--green); animation: blink 1s infinite; }
  .LEAK           { background: var(--red); }
  .OUT_OF_SERVICE { background: var(--orange); }
  .DISCONNECTED   { background: var(--gray); }
  @keyframes blink { 50% { filter: brightness(1.35); } }

  table { width: 100%; border-collapse: collapse; background: var(--card);
          border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>WaterManagement · Central</h1>
  <span id="status">connecting…</span>
</header>

<div id="admin">
  <label>Start for <input id="seconds" type="number" min="1" value="30"> s</label>
  <strong>All stations:</strong>
  <button data-cmd="start" data-ws="all">Start</button>
  <button data-cmd="block" data-ws="all">Block</button>
  <button data-cmd="activate" data-ws="all">Activate</button>
  <div id="results">Commands go to one station (buttons on its card) or to all of them.</div>
</div>

<div id="stations"></div>

<h2>Activation requests</h2>
<div class="scroll">
  <table>
    <thead><tr><th>Time</th><th>Request</th><th>Operator</th><th>Station</th>
               <th>Seconds</th><th>Verdict</th></tr></thead>
    <tbody id="requests"></tbody>
  </table>
</div>

<script>
const LABELS = { AVAILABLE: "Available", WATERING: "Watering", LEAK: "Leak",
                 OUT_OF_SERVICE: "Out of Service", DISCONNECTED: "Disconnected" };

// Text from the server goes into HTML, so escape it (never trust data as markup)
function esc(text) {
  return String(text ?? "").replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
}

// Each card is created ONCE; afterwards only its text and color change.
// (Rebuilding the buttons every second could swallow a click.)
const cards = {};

function makeCard(id) {
  const card = document.createElement("div");
  card.innerHTML = `
    <div class="id"></div><div class="loc"></div><div class="state"></div>
    <div class="live"></div><div class="op"></div>
    <div class="buttons">
      <button data-cmd="start" data-ws="${esc(id)}">Start</button>
      <button data-cmd="block" data-ws="${esc(id)}">Block</button>
      <button data-cmd="activate" data-ws="${esc(id)}">Activate</button>
    </div>`;
  document.getElementById("stations").append(card);
  return card;
}

function updateCard(s) {
  const card = cards[s.id] ??= makeCard(s.id);   // create it the first time only
  const watering = s.state === "WATERING";
  card.className = "card " + s.state;            // the state name IS the CSS class
  // textContent shows text as text (never as HTML), so no escaping is needed here
  card.querySelector(".id").textContent = s.id;
  card.querySelector(".loc").textContent = s.location;
  card.querySelector(".state").textContent = LABELS[s.state] ?? s.state;
  card.querySelector(".live").textContent =
    watering ? `${s.flow.toFixed(1)} L/min · ${s.volume.toFixed(2)} L` : "";
  card.querySelector(".op").textContent = watering ? `operator ${s.operator_id}` : "";
}

function requestRow(r) {
  return `<tr><td>${esc(r.time)}</td><td>${esc(r.request_id)}</td><td>${esc(r.operator_id)}</td>
          <td>${esc(r.ws_id)}</td><td>${esc(r.duration)}</td><td>${esc(r.verdict)}</td></tr>`;
}

async function refresh() {
  const status = document.getElementById("status");
  try {
    const state = await (await fetch("/api/state")).json();
    state.stations.forEach(updateCard);
    document.getElementById("requests").innerHTML =
      state.requests.map(requestRow).join("") || `<tr><td colspan="6">none yet</td></tr>`;
    status.className = "";
    status.textContent = `Central running · up ${state.central.uptime} s · ` +
                         `${state.central.connected}/${state.stations.length} stations connected`;
  } catch (e) {
    status.className = "down";
    status.textContent = "Central unreachable";
  }
}

// One click listener for ALL buttons, even ones created later (event delegation)
document.addEventListener("click", async (event) => {
  const button = event.target.closest("button[data-cmd]");
  if (!button) return;
  let command = `${button.dataset.cmd} ${button.dataset.ws}`;  // e.g. "block WS2"
  if (button.dataset.cmd === "start") {
    command += " " + document.getElementById("seconds").value;  // "start WS2 30"
  }
  const results = document.getElementById("results");
  try {
    const answer = await fetch("/api/command", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ command }),
    });
    results.textContent = (await answer.json()).results.join(" · ");
  } catch (e) {
    results.textContent = "command failed: Central unreachable";
  }
  refresh();  // show the effect right away instead of waiting up to 1 s
});

refresh();
setInterval(refresh, 1000);  // the PDF wants real time: ask again every second
</script>
</body>
</html>
