# Pakiet wm-central. [project.scripts] tworzy komendę WM_Central -> funkcja main() z wm_central/__init__.py
# (dlatego działa "uv run WM_Central ..."). wm-common pochodzi z tego samego workspace'u (tool.uv.sources).
[project]
name = "wm-central"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "wm-common",
]

[project.scripts]
WM_Central = "wm_central:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
wm-common = { workspace = true }
